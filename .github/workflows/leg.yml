name: leg
on:
  workflow_call:

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet curl_cffi
      - name: poll every 3 minutes
        env:
          GCHAT_WEBHOOK: ${{ secrets.GCHAT_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: watch.yml
          RADIUS_KM: '6'
        run: |
          set +e
          DEADLINE=$(python3 -c "import datetime;print(int(datetime.datetime(2026,9,22,16,30,tzinfo=datetime.timezone.utc).timestamp()))")
          LEG_END=$(( $(date -u +%s) + 20100 ))
          git config user.name  "paradise-watch"
          git config user.email "noreply@github.com"
          while true; do
            python3 align.py
            NOW=$(date -u +%s)
            echo "--- check at $(TZ=Asia/Kolkata date +%H:%M:%S) IST ---"
            python alert.py
            if grep -q '"fired": true' state.json; then echo "TIER 1 FOUND - stopping"; break; fi
            if ! git diff --quiet state.json; then
              git add state.json
              git commit -q -m "state: $(date -u +%H:%M)" && (git pull --rebase -q origin main 2>/dev/null; git push -q origin HEAD:main || echo "push retry next loop")
            fi
            [ "$NOW" -ge "$DEADLINE" ] && { echo "deadline reached"; break; }
            [ "$NOW" -ge "$LEG_END" ]  && { echo "leg done - next leg takes over"; break; }
          done
          echo "leg finished $(TZ=Asia/Kolkata date +%H:%M:%S) IST"
