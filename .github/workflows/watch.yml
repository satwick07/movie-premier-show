name: paradise-watch
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'      # best-effort safety net only; the chain below is the real watcher

permissions:
  contents: write
  actions: write

concurrency:
  group: paradise-watch
  cancel-in-progress: false

# GitHub caps ONE JOB at 6h, but a run may chain jobs with `needs`.
# Four chained jobs x ~5h35m of 2-minute polling covers the whole window to the
# 22:00 IST deadline WITHOUT depending on cron firing even once.
jobs:
  leg1:
    uses: ./.github/workflows/leg.yml
    secrets: inherit
  leg2:
    needs: leg1
    if: always()
    uses: ./.github/workflows/leg.yml
    secrets: inherit
  leg3:
    needs: leg2
    if: always()
    uses: ./.github/workflows/leg.yml
    secrets: inherit
  leg4:
    needs: leg3
    if: always()
    uses: ./.github/workflows/leg.yml
    secrets: inherit
